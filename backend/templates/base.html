<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<title>{% block title %}Pneumonia Detection{% endblock %}</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #ffffff;
    --text: #111827;
    --muted: #6b7280;
    --card: #f9fafb;
    --border: #e5e7eb;
}

[data-theme="dark"] {
    --bg: #0f172a;
    --text: #f8fafc;
    --muted: #cbd5f5;
    --card: #020617;
    --border: #1e293b;
}

body {
    margin: 0;
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
}

.text-muted { color: var(--muted) !important; }

.navbar {
    background: var(--bg);
    border-bottom: 1px solid var(--border);
}

.navbar a {
    color: var(--text) !important;
}

.card-ui {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
}
</style>
</head>

<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand fw-bold" href="/">Pneumonia Detection</a>

        <div class="ms-auto">
            <a href="/" class="me-3">Home</a>
            <a href="/about" class="me-3">About</a>
            <button class="btn btn-sm btn-outline-secondary" onclick="toggleTheme()">🌙</button>
        </div>
    </div>
</nav>

<!-- CONTENT MUST RENDER HERE -->
<div>
    {% block content %}{% endblock %}
</div>

<script>
function toggleTheme() {
    const html = document.documentElement;
    const theme = html.getAttribute("data-theme");
    const newTheme = theme === "dark" ? "light" : "dark";
    html.setAttribute("data-theme", newTheme);
    localStorage.setItem("theme", newTheme);
}

const saved = localStorage.getItem("theme");
if (saved) document.documentElement.setAttribute("data-theme", saved);
</script>

</body>
</html>
